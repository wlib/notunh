# Rebuilds and redeploys notunh.app on demand, with `gh workflow run refresh.yml`. The nightly rebuild is the
# Worker's own cron now (see wrangler.jsonc), so it no longer depends on GitHub's schedule, which pauses after
# 60 days without a commit. Cloudflare Workers Builds does the building and deploying from main whenever its
# Deploy Hook is POSTed; all this does is the POST. The hook URL can only start a build of main, so a plain
# repository secret is enough and the job needs no token at all

name: Refresh

on:
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 -X POST "$DEPLOY_HOOK"
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
