# Typechecks, tests, and builds every pull request. Needs no secrets: a pull request's code, a fork's included, is
# whatever its author wrote, so it gets a read-only token and nothing else. It also runs offline (NOTUNH_OFFLINE):
# the data comes from the fixtures (tests/fixtures/data/), so no pull request asks anything of the GTFS host,
# Nutrislice, or the laundry vendor

name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Copies the fixtures in as the data, then typechecks and tests before building (package.json prebuild)
      - run: npm run build
        env:
          NOTUNH_OFFLINE: 1
      # The service worker through real browsers, against the build just made
      - run: npx playwright install --with-deps chromium webkit
      - run: NOTUNH_DIST=dist npm run test:browser
