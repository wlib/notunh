# Archives what the Worker observed on each completed service day: the buses' fixes, Umo's predictions, and the polls
# that took them, losslessly (format in src/transit/observations/archive.mts). Each day is its own immutable release,
# observations-<day>, holding observations-<day>.ndjson.zst (.ndjson.gz for days archived before 2026-10-20) and a
# manifest.json naming the file. Its manifest is then merged into catalog.json on the observations release. The
# catalog is uploaded last, so a day is listed only once its archive is whole.
#
# The Worker keeps a day's samples in D1 for RETAIN_ARCHIVED_DAYS (14) once the catalog lists it, and until then
# however long that takes. Each run archives every settled day D1 still has that the catalog doesn't, the oldest
# first, so a failed run, or weeks of them, is made up by the next. One can also be run by hand for a range:
# `gh workflow run archive.yml -f from=2026-10-07 -f to=2026-10-13`.
#
# Needs the repository secret BUILD_TOKEN, the same value as the Worker's (`wrangler secret put BUILD_TOKEN`), to read
# its rows. Asks nothing of Umo. GitHub pauses schedules after 60 days without a commit, so the Worker's nightly run
# also dispatches this when it has a GITHUB_TOKEN (worker/index.mts). A day already published is left as it is, so
# the two can't publish it twice

name: Observations

on:
  schedule:
    # 9:30 UTC, after the Worker's nightly run at 8:17, when the service day before has long settled
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      from:
        description: The first service day to archive (YYYY-MM-DD), else every one not archived
        required: false
      to:
        description: The last service day to archive, else only the first
        required: false

permissions:
  contents: write

concurrency:
  group: observations

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A day is immutable once its manifest is up, so one published before is only merged into the catalog again,
      # never replaced. A release a failed run left without its manifest was never in the catalog, so its samples are
      # still in D1 and it's filled in again: the file first, then the manifest that marks it whole
      - name: Publish each day
        run: |
          mkdir -p archive
          for DAY in $(node scripts/archive.mts days $FROM $TO); do
            if gh release download "observations-$DAY" -p manifest.json -O "archive/$DAY.json" 2>/dev/null; then
              echo "observations-$DAY is published already"
              continue
            fi
            node scripts/archive.mts pack "$DAY" "archive/$DAY"
            [ -f "archive/$DAY/manifest.json" ] || continue
            gh release view "observations-$DAY" >/dev/null 2>&1 ||
              gh release create "observations-$DAY" --latest=false --title "Observations $DAY" \
                --notes "What the Worker observed on the service day $DAY: every stored minute of the buses' fixes and Umo's predictions, with the polls that took them, decoded, one row a line (src/transit/observations/raw.mts), and a manifest of its hash and counts"
            gh release upload "observations-$DAY" "archive/$DAY/observations-$DAY.ndjson.zst" --clobber
            gh release upload "observations-$DAY" "archive/$DAY/manifest.json" --clobber
            cp "archive/$DAY/manifest.json" "archive/$DAY.json"
          done
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          BUILD_TOKEN: ${{ secrets.BUILD_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      # The catalog is made once with its release and only merged into after. One that can't be read fails the run
      # rather than be replaced by tonight's days alone
      - name: Update the catalog
        run: |
          ls archive/*.json >/dev/null 2>&1 || { echo "Nothing to catalog"; exit 0; }
          if gh release view observations >/dev/null 2>&1; then
            gh release download observations -p catalog.json -O catalog.json
          else
            echo '{"days":[]}' > catalog.json
          fi
          node scripts/archive.mts catalog catalog.json archive/*.json > archive/catalog.json
          gh release view observations >/dev/null 2>&1 ||
            gh release create observations archive/catalog.json --latest=false --title "Observations" \
              --notes "catalog.json lists every service day archived, each published whole as its own observations-<day> release by the Observations workflow, with its manifest"
          gh release upload observations archive/catalog.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
