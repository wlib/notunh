# Typechecks, unit tests, and builds every pull request; the browser tests are run locally (docs/development.md). It
# needs no secrets: a pull request's code, a fork's included, is whatever its author wrote, so it gets a read-only
# token and nothing else. It also runs offline (NOTUNH_OFFLINE): the data comes from the fixtures
# (tests/fixtures/data/), so no pull request asks anything of any upstream source

name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The fixtures as the inputs and map data, typechecked and tested here alone, as Workers Builds only builds what
      # this has passed
      - run: node scripts/inputs.mts && npm run typecheck && npm test
        env:
          NOTUNH_OFFLINE: 1
      - run: npm run build
        env:
          NOTUNH_OFFLINE: 1
