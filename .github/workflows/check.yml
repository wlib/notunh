# Typecheck, test, and build every pull request. Pull requests run with a read-only token and no secrets,
# since their code, forks' included, is whatever the author wrote, and offline: the data comes from the fixtures
# (tests/fixtures/data/), so no pull request asks anything of the GTFS host, Nutrislice, or the laundry vendor

name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Copies the fixtures in as the data, typechecks, and tests first
      - run: npm run build
        env:
          NOTUNH_OFFLINE: 1
      # The service worker through real browsers, against the build just made
      - run: npx playwright install --with-deps chromium webkit
      - run: NOTUNH_DIST=dist npm run test:browser
