# Rebuilds and redeploys notunh.app on demand, with `gh workflow run refresh.yml`. The nightly rebuild is the
# Worker's own cron (wrangler.jsonc), which doesn't depend on GitHub's schedules pausing after 60 days without a
# commit. Cloudflare Workers Builds builds and deploys main whenever its Deploy Hook is POSTed, and this job only
# POSTs it. Needs the repository secret CLOUDFLARE_DEPLOY_HOOK. The hook URL can only start a build of main, so a
# plain secret is enough and the job needs no token at all

name: Refresh

on:
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 -X POST "$DEPLOY_HOOK"
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
